<style>

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#6fadf7; --accent-soft:#16304e;
  --ok:#4cc38a; --ok-soft:#12301f; --warn:#e0b040; --warn-soft:#382d0e; --bad:#f2766c; --bad-soft:#3b1916; --ext:#b497f0; --ext-soft:#281f3d;
  --t-ideal:#9aa8b6; --t-va:#3fc1c1; --t-rtl:#b497f0; --t-transistor:#6fadf7; --t-composition:#f0a050; --t-mixed:#e07ab8;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --sunken:#0b1016; --ink:#e3e9ef; --muted:#9aa8b6; --faint:#6e7c8b; --line:#2a3643;
  --accent:#6fadf7; --accent-soft:#16304e;
  --ok:#4cc38a; --ok-soft:#12301f; --warn:#e0b040; --warn-soft:#382d0e; --bad:#f2766c; --bad-soft:#3b1916; --ext:#b497f0; --ext-soft:#281f3d;
  --t-ideal:#9aa8b6; --t-va:#3fc1c1; --t-rtl:#b497f0; --t-transistor:#6fadf7; --t-composition:#f0a050; --t-mixed:#e07ab8;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.93em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:600;font-size:16px;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand svg{display:block}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:5px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav a.on{background:var(--accent-soft);color:var(--accent)} .nav a:hover{text-decoration:none;color:var(--ink)}
.demo{margin-left:auto;font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:99px}
main.wrap{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
#theme-btn{padding:4px 10px;font-size:13px;color:var(--muted)}
#theme-btn svg{display:block}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}
footer .wrap{padding-block:14px;display:flex;gap:6px 18px;flex-wrap:wrap}
/* type */
h1{font-size:24px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:13px;margin:0;font-weight:600;color:var(--muted);letter-spacing:.02em}
p{margin:0;max-width:72ch}
.lede{color:var(--muted);font-size:15px}
.crumb{font-size:13px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap}
/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line)}
.panel>header .sub{color:var(--faint);font-size:12.5px}
.panel>.body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.cols>*{min-width:0;display:flex;flex-direction:column;gap:22px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start}
.two>*{min-width:0}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
/* tables */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--sunken);white-space:nowrap}
td.r,th.r{text-align:right} td.nw,th.nw{white-space:nowrap}
tbody tr:hover>td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
/* chips */
.tb,.pill,.st{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 7px;font-size:12px;line-height:1.6;white-space:nowrap}
.tb{border:1px solid currentColor;font-weight:500}
.t-ideal{color:var(--t-ideal)} .t-va{color:var(--t-va)} .t-rtl{color:var(--t-rtl)} .t-transistor{color:var(--t-transistor)} .t-composition{color:var(--t-composition)} .t-mixed{color:var(--t-mixed)}
.pill{background:var(--sunken);color:var(--muted)}
.st{font-weight:500} .st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.verified{color:var(--ok);background:var(--ok-soft)} .st.self{color:var(--warn);background:var(--warn-soft)}
.st.disputed{color:var(--bad);background:var(--bad-soft)} .st.none{color:var(--faint);background:var(--sunken)}
.st.ext{color:var(--ext);background:var(--ext-soft)} .st.info{color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--sunken);border-radius:6px;padding:10px 12px;overflow-x:auto}
code{font-family:var(--mono);font-size:.93em;background:var(--sunken);padding:1px 5px;border-radius:4px}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)} .tabs a:hover{text-decoration:none;color:var(--ink)}
.tabs .n{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:4px}
/* home */
.stats{display:flex;gap:10px 28px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.2}
.stats span{font-size:12.5px;color:var(--muted)}
.filters{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input[type=search]{flex:1 1 220px;min-width:0}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.ipname{font-family:var(--mono);font-weight:600;font-size:14.5px}
.feed{display:flex;flex-direction:column}
.feed>div{padding:9px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:13px}
.feed>div:last-child{border-bottom:0}
.feed .when{font-size:12px;color:var(--faint)}
/* detail head */
.head{display:flex;gap:18px 28px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.head>div{min-width:0;display:flex;flex-direction:column;gap:8px;flex:1 1 420px}
.addr{font-family:var(--mono);font-size:21px;font-weight:600;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 12px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.note{background:var(--sunken);border-radius:6px;padding:9px 12px;color:var(--muted);font-size:13px}
.alert{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.alert h2{color:var(--bad)}
.alert ul,.plain ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:78ch}
svg text{font-family:var(--mono)}
.sym{flex:0 0 auto;align-self:center}
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tree ul{list-style:none;margin:6px 0 0 9px;padding:0 0 0 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tree li>div{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.viewer{border:1px dashed var(--line);border-radius:8px;background:var(--sunken);padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);text-align:center}
.dsval{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.verified{background:var(--ok)} .dot.self{background:var(--warn)} .dot.disputed{background:var(--bad)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px);z-index:20}
</style>

<script>
"use strict";
/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=p=>String(p).replace(/_/g,'-u-');
const L=(...parts)=>'#'+parts.map(enc).join('--');
const hstr=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const sha=(s,n=12)=>{let o='',h=hstr(s);while(o.length<n){h=Math.imul(h^(h>>>13),0x5bd1e995)>>>0;o+=h.toString(16).padStart(8,'0')}return o.slice(0,n)};
const rng=seed=>{let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const uniq=a=>[...new Set(a)];
const fmt=v=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);

const P=(name,dir,kind,w)=>({name,dir,kind,w});
const IPS=[

  desc:'clk 上升沿比较 inp 与 inn，输出互补的满摆幅判决；clk 为低时两个输出都复位到 vdd。',
  pins:[P('inp','in','analog'),P('inn','in','analog'),P('clk','in','digital'),P('outp','out','digital'),P('outn','out','digital'),P('vdd','','supply'),P('vss','','ground')]},
 {id:'cdac-10b',title:'10 位二进制电容 DAC',account:'alice-ic',author:'Alice Zhang',date:'2026-10-04',
  desc:'sample 为高时在顶板采样 vin；之后按 d 把各位电容的底板接到 vrefp 或 vrefn，顶板输出残差电压。',
  pins:[P('vin','in','analog'),P('vrefp','in','analog'),P('vrefn','in','analog'),P('sample','in','digital'),P('d','in','digital',10),P('top','out','analog'),P('vss','','ground')]},

  pins:[P('clk','in','digital'),P('rst_n','in','digital'),P('start','in','digital'),P('cmp','in','digital'),P('d','out','digital',10),P('sample','out','digital'),P('done','out','digital'),P('vdd','','supply'),P('vss','','ground')]},

 {id:'ota-5t',title:'五管 OTA',account:'dkim',author:'',date:'2026-10-12',
  desc:'单级差分输入、单端输出的跨导放大器，尾电流由 ibias 镜像得到。',
  pins:[P('inp','in','analog'),P('inn','in','analog'),P('ibias','in','analog'),P('out','out','analog'),P('vdd','','supply'),P('vss','','ground')]},
 {id:'bandgap-1v2',title:'1.2 V 带隙基准',account:'chen-lab',author:'Chen Wei',date:'2026-10-20',
  desc:'en 为高时在 vref 输出约 1.2 V 的基准电压，随温度和电源的变化很小；en 为低时关断。',

];

const imp=(ip,g,v,type,proc,account,author,date,based,sum,x={})=>I.push({ip,g,v,type,proc,account,author,date,based,sum,origin:null,uses:null,...x});
// strongarm-comp
imp('strongarm-comp','ideal',1,'ideal','','alice-ic','Alice Zhang','2026-10-02',[],'理想判决；失调和输入噪声是实例参数');
imp('strongarm-comp','va-noise',1,'va','','alice-ic','Alice Zhang','2026-10-05',['strongarm-comp@ideal/v1'],'VA 模型：失调、热噪声，判决延时随输入差按对数变化');

imp('strongarm-comp','ext-uni',1,'transistor','sky130','eda-fox','','2026-11-02',[],'带失调校准电容阵列',{origin:{mode:'reference',repo:'uni-msc/comparators',sha:'e02f5aa',path:'sa_cal/',license:'Apache-2.0',authors:'uni-msc 课题组',patents:'none'}});

imp('cdac-10b','ideal',1,'ideal','','alice-ic','Alice Zhang','2026-10-04',[],'理想电容阵列，无失配');
imp('cdac-10b','sky130-mom',1,'transistor','sky130','bob-analog','r08(fable51)','2026-10-14',[],'MOM 单位电容 2 fF，二进制权重');

imp('sar-logic-10b','rtl-basic',1,'rtl','','alice-ic','Alice Zhang','2026-10-04',[],'同步 SAR 状态机（Verilog）');

imp('bootstrap-sw','ideal',1,'ideal','','bob-analog','r08(fable51)','2026-10-07',[],'理想开关，固定导通电阻');
imp('bootstrap-sw','sky130-nmos',1,'transistor','sky130','bob-analog','r08(fable51)','2026-10-16',[],'经典自举结构，自举电容 400 fF');
// sar-adc
